# Toda ruta, modelo, umbral y prompt vive aquí. Las credenciales van en .env (nunca en el repo).

paths:
  audio_dir: data/audio
  cache_dir: data/cache
  ground_truth_t1: data/ground_truth/t1_entrevistas.csv
  ground_truth_t2: data/ground_truth/t2_llamadas.csv
  results_dir: results
  models_dir: models             # pesos de Whisper (ignorados por git; se descargan solos)

asr:
  library: faster-whisper
  default_model: small           # lo cambias según el benchmark (ver results/asr_benchmark_t1.md)
  device: auto                   # auto | cuda | cpu. "cuda" sin GPU da ERROR (no hay fallback silencioso)
  compute_type: float16          # float16 | int8 (en CPU float16 se baja a int8 automáticamente)
  language: es
  beam_size: 5
  temperature: 0.0               # determinista: mismo audio -> misma transcripción
  condition_on_previous_text: false
  vad_filter: false
  use_glossary_default: false    # decide con el benchmark (glosario plano vs con vocabulario)
  glossary_mechanism: hotwords   # hotwords (faster-whisper >= 1.0.3, verificado en 1.2.1) | initial_prompt
  glossary:
    t1: [Python, pandas, SQL, Power BI, Docker, Django, PostgreSQL, Git, AWS, Excel,
         scikit-learn, Tableau, Airflow, dbt, Kubernetes, Looker Studio]
    t2: [pollo a la brasa, lomo saltado, ceviche clásico, chicha morada, arroz con mariscos,
         Inca Kola, Marea Norte]
  # Configuración cuyas transcripciones están en caché y que la app muestra sin re-transcribir
  cache_corpus: {model: large-v3, device: cuda, compute_type: float16, glossary: false}

normalization:                   # ver metrics/texto.py: se aplica IGUAL a referencia e hipótesis
  lowercase: true
  strip_punctuation: true
  strip_accents: false
  collapse_whitespace: true
  numbers_to_digits: true

benchmark:                       # T1 Fase 2 (scripts/benchmark_asr.py). Corre en Colab con GPU.
  bootstrap_n: 2000
  bootstrap_seed: 0
  vram_minima_mb: 300            # por debajo de esto NO se considera probado que se usó la GPU
  experimentos:
    - {id: small_gpu_fp16,      model: small,    device: cuda, compute_type: float16}
    - {id: small_gpu_int8,      model: small,    device: cuda, compute_type: int8}
    - {id: small_cpu_int8,      model: small,    device: cpu,  compute_type: int8, max_clips: 2}
    - {id: large_gpu_fp16,      model: large-v3, device: cuda, compute_type: float16}
    - {id: large_gpu_int8,      model: large-v3, device: cuda, compute_type: int8}
    - {id: small_gpu_fp16_glos, model: small,    device: cuda, compute_type: float16, glosario: true}
    - {id: large_gpu_fp16_glos, model: large-v3, device: cuda, compute_type: float16, glosario: true}
  comparaciones:                 # pares [A, B]; se reporta A frente a B sobre los mismos clips
    precision:   [[small_gpu_fp16, small_gpu_int8], [large_gpu_fp16, large_gpu_int8]]
    dispositivo: [[small_gpu_int8, small_cpu_int8]]
    glosario:    [[small_gpu_fp16, small_gpu_fp16_glos], [large_gpu_fp16, large_gpu_fp16_glos]]
    tamano:      [[small_gpu_fp16, large_gpu_fp16]]

extraction:
  reference_date: "2026-11-02"   # fecha ficticia de las entrevistas: resuelve disponibilidad relativa
  method: rules                  # rules | llm
  llm_provider: gemini           # anthropic | gemini  (solo se usa con method: llm)
  llm_model: gemini-3.7-flash   # gemini-3.7-flash | claude-sonnet-5-5 ...  Claves en .env: GEMINI_API_KEY / ANTHROPIC_API_KEY
  unverified_label: sin_verificar
  english_synonyms:              # nivel_ingles: palabra que debe aparecer literalmente en la transcripción
    basico: [básico, basico, principiante]
    intermedio: [intermedio, b2, b1]
    avanzado: [avanzado, fluido, c1, c2, nativo]
  lexicon_tecnologias:           # reglas: qué tecnologías buscar en el texto (el glosario de ASR es otra cosa)
    [Python, pandas, SQL, Power BI, Docker, Django, PostgreSQL, Git, AWS, Excel, scikit-learn, Tableau,
     Airflow, dbt, Kubernetes, Looker Studio, Figma, Adobe XD, Illustrator, VBA, SAP, React, JavaScript,
     TypeScript, Google Analytics, Meta Ads, HubSpot, Canva, Stata, Java, Spark, Hadoop, MySQL, MongoDB,
     TensorFlow, PyTorch, Jira, Notion, Salesforce, Photoshop, Linux, Azure, GCP]
  distritos:                     # reglas T2: distritos de Lima para cerrar la dirección de entrega
    [San Miguel, Magdalena, Surco, Santiago de Surco, Jesús María, Pueblo Libre, Breña, Los Olivos,
     Cercado de Lima, Lima, Miraflores, San Isidro, Barranco, La Molina, San Borja, Lince, San Martín de Porres,
     Comas, Independencia, Rímac, Chorrillos, Villa El Salvador, Ate, Callao, Surquillo, San Luis, La Victoria]
  prompts:
    t1: |
      Eres un extractor de datos. Del texto de una entrevista de trabajo devuelve SOLO un JSON con estas claves:
      anios_experiencia (número; 3.5 si dice "tres años y medio"; 0.5 si dice "seis meses"),
      ultimo_puesto (texto, tal como se dice),
      tecnologias (lista; incluye SOLO las que la persona USA, no las que está aprendiendo),
      pretension_salarial (número mensual; si se corrige, el valor final),
      moneda ("PEN" si dice soles, "USD" si dice dólares),
      disponibilidad ("inmediata" o fecha ISO AAAA-MM-DD; la fecha de hoy es {fecha_referencia}; resuelve "en quince días", "a fin de mes", "el primero de diciembre" respecto a esa fecha),
      nivel_ingles ("basico", "intermedio" o "avanzado").
      Usa SOLO información que aparezca en el texto. Si un campo no aparece, devuelve null. Sin explicaciones.
    t2: |
      Eres un extractor de datos. Del texto de una llamada de venta de un restaurante devuelve SOLO un JSON con:
      items (lista de {producto, tamano, cantidad, precio_unitario}; registra el pedido FINAL si el cliente se corrige),
      promocion (texto de la promoción aplicada, o null si no se aplica ninguna),
      direccion_entrega (texto; "recojo en tienda" si recoge el pedido),
      metodo_pago ("efectivo", "tarjeta", "yape" o "plin"),
      total_dicho (número: el total que el vendedor DICE en voz alta, aunque esté mal sumado).
      Usa SOLO información que aparezca en el texto. Si un campo no aparece, devuelve null. Sin explicaciones.
  t2:
    dominio: restaurante
    menu:                        # carta del restaurante inventado (la misma de scripts/guiones_t2.md)
      - {producto: pollo a la brasa, alias: [pollo a la brasa, pollo], tamanos: {cuarto: 22, medio: 40, entero: 75}}
      - {producto: lomo saltado, alias: [lomo saltado, lomo], tamanos: {unico: 30}}
      - {producto: ceviche clásico, alias: [ceviche clásico, ceviche], tamanos: {personal: 28, para dos: 48}}
      - {producto: arroz con mariscos, alias: [arroz con mariscos], tamanos: {unico: 32}}
      - {producto: chicha morada, alias: [chicha morada, chicha], tamanos: {vaso: 6, jarra: 16}}
      - {producto: gaseosa Inca Kola, alias: [gaseosa inca kola, inca kola, gaseosa], tamanos: {1.5 litros: 12}}
    promos:                      # la regla alimenta el validador aritmético
      - {id: P1, etiqueta: "descuento de diez soles en pedidos desde ochenta soles",
         patrones: ["descuento de 10 soles"],
         regla: {tipo: descuento_fijo, monto: 10, minimo: 80}}
      - {id: P2, etiqueta: "dos por uno en chicha morada en vaso",
         patrones: ["2 por 1"],
         regla: {tipo: n_por_m, producto: chicha morada, tamano: vaso, lleva: 2, paga: 1}}
    pagos:
      efectivo: [efectivo]
      tarjeta: [tarjeta]
      yape: [yape]
      plin: [plin]
    prefijos_calle: [avenida, av, calle, jirón, jr, pasaje, psje, alameda, malecón, urbanización, urb]
    recojo: [recojo, recoger, recogerlo, recogerla]
    correcciones: [espera, perdón, perdon, mejor, equivoqué, equivoque, cambio, pensándolo, "en vez de"]

schemas:
  t1: [anios_experiencia, ultimo_puesto, tecnologias, pretension_salarial, disponibilidad, nivel_ingles]
  t2: [items, promocion, direccion_entrega, metodo_pago, total_dicho]

ladder:                          # escalera de degradación (T2). Se construye con scripts/ladder.py
  dir: data/audio_ladder
  niveles: [L0, L1, L2, L3]
  L1: {codec: libopus, bitrate: 16k, canales: 1, ext: ogg}                      # nota de voz de WhatsApp (Opus)
  L2: {lowcut_hz: 300, highcut_hz: 3400, sample_rate: 8000, ext: wav}          # llamada telefónica
  L3: {base: L1, snr_db: 10, ruido: rosa, semilla: 0, ventana_activa_db: 30}   # ruido ambiente ANTES del códec
  # SNR 10 dB: voz 3 veces más fuerte que el ruido en amplitud; típico de una calle o un restaurante con gente.
  # La SNR se mide sobre los tramos con voz (ver scripts/ladder.py) y se guarda en data/audio_ladder/snr.json.

validation:
  tolerancia_soles: 0.5
